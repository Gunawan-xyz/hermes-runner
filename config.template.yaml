# Templat konfigurasi awal Hermes Agent (dipakai hanya pada run pertama,
# saat restore dari Supabase masih kosong; run berikutnya memakai konfigurasi
# dari restore).
#
# JALUR MODEL UTAMA (keputusan Awan 13 Nov, diverifikasi Lyra dari dokumentasi
# komunitas Hermes): Hermes menjalankan OpenCode CLI ASLI sebagai subprocess
# lewat ACP (plugin "OpenCode Free ACP", cryptobredda/hermes-opencode-free-acp,
# butuh Hermes >= 0.22.2). Prinsipnya sama dengan Paperclip: panggilan model
# berasal dari dalam OpenCode, jadi free tier bawaan OpenCode bisa dipakai
# TANPA API key. Provider bawaan Hermes yang menembak endpoint Zen langsung
# (opencode-free HTTP) sudah ditolak OpenCode sejak Sep 2026
# (FreeTierError), jangan dipakai.
#   provider : opencode-free-acp
#   model    : opencode/big-pickle (cadangan: opencode/deepseek-v4.1-flash-free)
# Smoke test membuktikan model mana yang menjawab; hasilnya dicatat di log run.
#
# RENCANA B (hanya bila jalur ACP gagal total): provider Zen langsung dengan
# Secret OPENCODE_API_KEY. Secret itu sengaja dibiarkan placeholder sekarang.
# Gateway Telegram aktif bila Secret TELEGRAM_BOT_TOKEN terisi.

model:
  provider: opencode-free-acp
  model: opencode/deepseek-v4.1-flash-free

gateway:
  telegram:
    enabled: true
    # Hanya user ini yang dilayani bot (dari Secret TELEGRAM_USER_ID)
    allowed_user_id: "__ISI_DARI_SECRET_TELEGRAM_USER_ID__"
