name: Hermes Agent 24/7

# Rantai sesi Hermes: setiap run menjalankan Hermes sampai mendekati batas
# 6 jam job GitHub-hosted, memicu run berikutnya dari dalam (workflow_dispatch
# adalah pengecualian yang tetap jalan memakai GITHUB_TOKEN bawaan), lalu
# backup state terakhir sebelum selesai. Watchdog (hermes-watchdog.yml)
# menyalakan lagi rantai yang putus.
#
# Menghentikan rantai: set repo Variable CHAIN_ENABLED=false lalu batalkan
# run yang sedang jalan. Backup/restore tetap aman karena state di Supabase.

on:
  workflow_dispatch:
    inputs:
      pairing_code:
        description: "Kode pairing Telegram sekali pakai (dari pesan bot saat /start). Kosongkan untuk sesi biasa."
        required: false
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: hermes-chain
  cancel-in-progress: false

jobs:
  hermes:
    name: Hermes session
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Catat waktu mulai sesi
        run: echo "SESSION_START=$(date +%s)" >> "$GITHUB_ENV"

      # 1. Restore state Hermes dari backup terakhir (kalau ada)
      - name: Restore state dari Supabase
        run: python3 sync_memory.py pull

      # 2. Pasang Hermes Agent + OpenCode
      - name: Pasang Hermes Agent dan OpenCode
        run: ./install_hermes.sh

      # 3. Seed konfigurasi awal hanya bila restore kosong (run pertama)
      - name: Seed konfigurasi awal (bila belum ada)
        run: |
          if [ ! -f "$HOME/.hermes/config.yaml" ]; then
            mkdir -p "$HOME/.hermes"
            cp config.template.yaml "$HOME/.hermes/config.yaml"
            echo "Konfigurasi awal dipasang dari templat."
          else
            echo "Konfigurasi dari restore dipakai."
          fi

      # 3b. Akses admin: Tailscale + SSH (pola yang sama dengan
      #     ssh-access-linux.yml di My-Desktop, tanpa password tertulis).
      #     Dilewati dengan aman bila secret-nya masih placeholder.
      - name: Setup Tailscale + SSH
        run: |
          if [ -z "${TAILSCALE_AUTHKEY:-}" ] || [ "$TAILSCALE_AUTHKEY" = "BELUM_DIISI" ] \
             || [ -z "${SSH_PUBLIC_KEY:-}" ] || [ "$SSH_PUBLIC_KEY" = "BELUM_DIISI" ]; then
            echo "TAILSCALE_AUTHKEY / SSH_PUBLIC_KEY belum diisi, akses SSH dilewati."
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="hermes-${{ github.run_id }}"
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server > /dev/null
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PUBLIC_KEY" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh" && chmod 600 "$HOME/.ssh/authorized_keys"
          sudo service ssh start || sudo systemctl start ssh || true
          echo "== Akses SSH sesi ini =="
          echo "Hostname : hermes-${{ github.run_id }}"
          echo "IP       : $(tailscale ip -4)"
          echo "Perintah : ssh runner@$(tailscale ip -4)"

      # 3b. Diagnostik (tidak pernah menggagalkan run): memetakan versi,
      #     plugin, daftar provider, dan bentuk config yang benar-benar
      #     berlaku, supaya smoke test dan templat config bisa dikunci dari
      #     fakta log, bukan tebakan. Hanya bagian model dari config yang
      #     ditampilkan.
      - name: Diagnostik Hermes
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          echo "== hermes --version =="; hermes --version || true
          echo "== opencode --version =="; opencode --version || true
          echo "== opencode acp tersedia? =="; opencode acp --help 2>&1 | head -4 || true
          echo "== hermes plugins list =="; hermes plugins list || true
          echo "== hermes doctor =="; hermes doctor 2>&1 | head -40 || true
          echo "== kunci teratas config.yaml =="; grep -E '^[a-z_]+:' ~/.hermes/config.yaml || true
          echo "== bagian model config.yaml =="; grep -A 8 '^model:' ~/.hermes/config.yaml || true
          echo "== isi ~/.hermes =="; ls ~/.hermes || true
          echo "== model gratis di katalog OpenCode =="; opencode models 2>&1 | grep -i free | head -15 || true

      # 3c. Terapkan konfigurasi model pemenang di SETIAP sesi (bukan cuma
      #     seed): kombinasi yang lulus smoke test run uji kelima adalah
      #     plugin cryptobredda (provider opencode-free-acp) + model
      #     opencode/deepseek-v4.1-flash-free. `hermes config set` terbukti
      #     menempel di skema config v53 (run uji kelima), dan langkah ini
      #     membuat sesi selalu konvergen walau state restore berasal dari
      #     konfigurasi lama. base_url/api_mode dikosongkan karena itu
      #     penanda milik plugin jovylle, bukan plugin ini.
      - name: Terapkan konfigurasi model
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          hermes config set model.provider opencode-free-acp
          hermes config set model.model opencode/deepseek-v4.1-flash-free
          hermes config set model.base_url "" || true
          hermes config set model.api_mode "" || true
          echo "== model yang berlaku =="
          grep -A 6 '^model:' ~/.hermes/config.yaml || true
          # Jalur API key OpenCode (permintaan Awan 13 Nov malam): key dari
          # secret OPENCODE_API_KEY ditulis ke ~/.hermes/.env dengan nama
          # yang dicari provider Hermes (opencode-zen / opencode-go).
          # Nilainya tidak pernah dicetak ke log.
          touch ~/.hermes/.env
          sed -i '/^OPENCODE_ZEN_API_KEY=/d; /^OPENCODE_GO_API_KEY=/d' ~/.hermes/.env
          if [ -n "$OPENCODE_API_KEY" ] && [ "$OPENCODE_API_KEY" != "BELUM_DIISI" ]; then
            echo "OPENCODE_ZEN_API_KEY=$OPENCODE_API_KEY" >> ~/.hermes/.env
            echo "OPENCODE_GO_API_KEY=$OPENCODE_API_KEY" >> ~/.hermes/.env
            echo "API key OpenCode ditulis ke .env (isi tidak ditampilkan)"
          else
            echo "OPENCODE_API_KEY kosong/placeholder, jalur API key dilewati"
          fi
          # Rantai fallback (dok resmi Hermes: fallback_providers di
          # config.yaml): 1) opencode-zen model yang sama lewat API key
          # (jalan berbeda dari jembatan ACP), 2) ACP dengan model GLM
          # (jalan yang sama, model berbeda, seperti /model manual Awan).
          # Ditulis PALING AKHIR di langkah ini supaya tidak tertimpa
          # config set di atas; penjaga grep membuatnya idempotent.
          if ! grep -q '^fallback_providers:' ~/.hermes/config.yaml; then
            cat >> ~/.hermes/config.yaml <<'YAML'

          fallback_providers:
            - provider: opencode-zen
              model: deepseek-v4.1-flash-free
            - provider: opencode-free-acp
              model: opencode/glm-5.3-flash-free
          YAML
            echo "fallback_providers ditulis ke config.yaml"
          else
            echo "fallback_providers sudah ada, tidak diubah"
          fi
          hermes fallback list || true

      # 3d. Setujui pairing Telegram (hanya bila dispatch membawa kode):
      #     bot Hermes memakai gerbang pairing, bukan allowlist statis.
      #     Permintaan pairing tersimpan di state (folder pairing/) dan ikut
      #     backup/restore, jadi persetujuan di sini berlaku seterusnya.
      #     Kode sekali pakai dan kedaluwarsa 1 jam, dikirim lewat input
      #     dispatch, tidak pernah ditulis ke repo.
      - name: Setujui pairing Telegram (bila ada kode)
        if: inputs.pairing_code != ''
        env:
          PAIRING_CODE: ${{ inputs.pairing_code }}
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          hermes pairing approve telegram "$PAIRING_CODE"

      # 3e. Uji jalur API key dari IP runner (diagnostik, TIDAK menggagalkan
      #     run): dari jaringan Lyra jalur ini kena batas pemakaian gratis
      #     (HTTP 429 FreeUsageLimitError), jadi bukti penentunya adalah hasil
      #     check --live dari mesin runner sendiri, tercatat di log sesi.
      - name: Uji jalur API key OpenCode (diagnostik)
        continue-on-error: true
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          set -a; [ -f ~/.hermes/.env ] && . ~/.hermes/.env; set +a
          hermes fallback check --live || true

      # 4. Smoke test model: Hermes wajib menjawab lewat OpenCode.
      #    Gagal di sini = run berhenti; watchdog akan mencoba lagi berkala.
      - name: Smoke test model (OpenCode)
        run: ./smoke_test.sh

      # 5. Jalankan gateway Hermes di latar belakang (chat dari HP via Telegram)
      - name: Jalankan gateway Hermes
        run: |
          # Installer atau langkah lain bisa sudah menyalakan gateway host
          # lebih dulu (kejadian run uji keenam). Gateway lama dihentikan
          # agar yang melayani adalah gateway dengan config + env sesi ini.
          # JANGAN pakai `gateway restart` di sini: pada sesi rantai pertama
          # perintah itu tidak kembali (kemungkinan ia sendiri yang jadi
          # proses gateway di depan) dan menggantung langkah ini belasan
          # menit. Semua perintah kendali dibungkus timeout supaya langkah
          # ini selalu selesai; start nohup di bawah adalah jalurnya.
          timeout 30 hermes -p default gateway stop || true
          sleep 2
          nohup hermes gateway > "$HOME/hermes-gateway.log" 2>&1 &
          echo "Gateway dimulai, pid $!"
          sleep 10
          tail -15 "$HOME/hermes-gateway.log" || true
          ps aux | grep -i "[h]ermes gateway" | head -3 || true

      # 6. Backup berkala tiap 30 menit di latar belakang
      - name: Mulai loop backup berkala
        run: |
          nohup bash -c 'while true; do sleep 1800; python3 sync_memory.py push || true; done' > "$HOME/hermes-backup.log" 2>&1 &
          echo "Loop backup berkala dimulai, pid $!"

      # 7. Tahan sesi sampai menit ke-335, lalu picu run berikutnya
      - name: Keep alive dan sambung rantai
        run: |
          TARGET=$(( SESSION_START + 335 * 60 ))
          while [ "$(date +%s)" -lt "$TARGET" ]; do sleep 60; done
          if [ "${{ vars.CHAIN_ENABLED }}" != "false" ]; then
            gh workflow run hermes.yml
            echo "Run berikutnya sudah dipicu."
          else
            echo "CHAIN_ENABLED=false, rantai tidak disambung."
          fi

      # 8. Backup akhir, selalu jalan walau run dibatalkan
      - name: Backup akhir ke Supabase
        if: always()
        run: python3 sync_memory.py push
